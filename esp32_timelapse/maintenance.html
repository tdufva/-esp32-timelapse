<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32-CAM Huolto</title>
<style nonce="__NONCE__">
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#17201c;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:24px}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid #d9dfd7}header p{margin:5px 0;color:#66716b;font-size:13px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;margin-top:24px}section{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid #d9dfd7}img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#17201c;image-rendering:pixelated;border-radius:4px}dl{display:grid;gap:14px;margin:16px 0}dt{font-size:12px;color:#66716b}dd{font-size:14px;margin:4px 0 0;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px;font-size:13px;color:#66716b;min-width:0}input{font:inherit;min-width:0;width:100%;padding:9px;border:1px solid #d9dfd7;border-radius:5px;background:#fff;color:#17201c}input[type=checkbox]{width:18px;height:18px;accent-color:#147d72}.check{display:flex;align-items:center;gap:8px;margin:16px 0}button{font:600 14px system-ui;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #d9dfd7;background:#fff;color:#17201c;border-radius:6px;min-height:42px;padding:9px 14px;cursor:pointer}.primary{background:#147d72;border-color:#147d72;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #147d7250;outline-offset:2px}fieldset{border:0;padding:0;margin:0;min-width:0}.message{min-height:20px;font-size:13px;overflow-wrap:anywhere}.muted{color:#66716b;font-size:12px;overflow-wrap:anywhere}.hash{font:11px ui-monospace,monospace;overflow-wrap:anywhere}progress{width:100%;accent-color:#147d72;height:9px;margin-top:14px}[hidden]{display:none!important}@media(max-width:650px){main{padding:16px}.layout{grid-template-columns:1fr;gap:8px}header{align-items:flex-start;flex-wrap:wrap}.snapshot{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px}.snapshot dl{margin:0}.snapshot dt,.snapshot dd{font-size:12px}.fields{gap:10px}h1{font-size:24px}}
</style></head><body><main>
<header><div><h1>ESP32-CAM</h1><p>Huolto · <span id="sessionState">Yhdistetään…</span></p></div><button id="finish" type="button"><i data-icon="Power"></i>Päätä huolto</button></header>
<div class="layout"><aside class="snapshot"><div><img id="photo" alt="Viimeisin kamerakuva" hidden><p id="photoTime" class="muted"></p></div><dl><div><dt>Ohjelmaversio</dt><dd id="firmware">—</dd></div><div><dt>Ohjelmapaikka</dt><dd id="slot">—</dd></div><div><dt>Seuraava kuva</dt><dd id="nextCapture">—</dd></div></dl></aside>
<div><section><h2>Päivä ja yö</h2><form id="scheduleForm"><fieldset id="scheduleFields"><div class="fields"><label>Päivä alkaa<input id="dayStart" type="time" required value="07:00"></label><label>Yö alkaa<input id="nightStart" type="time" required value="22:00"></label><label>Päivän kuvausväli (min)<input id="dayInterval" type="number" min="5" max="1440" step="1" value="60" required></label><label>Yön kuvausväli (min)<input id="nightInterval" type="number" min="5" max="1440" step="1" value="180" required></label></div><label class="check"><input id="nightEnabled" type="checkbox" checked>Kuvaa öisin</label><button class="primary" type="submit"><i data-icon="Save"></i>Tallenna ajoitus</button></fieldset></form><p id="scheduleMessage" class="message" role="status"></p></section>
<section><h2>Ohjelmapäivitys</h2><form id="updateForm"><label>Ohjelmatiedosto<input id="firmwareFile" type="file" accept=".bin,application/octet-stream" required></label><p id="fileInfo" class="muted"></p><p id="fileHash" class="hash"></p><div class="actions"><button id="upload" class="primary" type="submit" disabled><i data-icon="Upload"></i>Päivitä ohjelma</button><button id="cancelUpload" type="button" hidden><i data-icon="X"></i>Keskeytä</button></div><progress id="progress" value="0" max="1" hidden></progress></form><p id="updateMessage" class="message" role="status"></p></section></div></div>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);let info=null,upload=null,selected=null,closed=false;const labels={invalid_schedule:'Tarkista kellonajat ja kuvausvälit.',csrf_rejected:'Istunto vaihtui. Päivitä sivu.',schedule_save_failed:'Ajoituksen tallentaminen epäonnistui.',wrong_firmware_image:'Väärä ohjelmatiedosto.',firmware_rejected:'Ohjelmatiedostoa ei hyväksytty.',firmware_verification_failed:'Ohjelman tarkistus epäonnistui.',update_begin_failed:'Päivitystä ei voitu aloittaa.'};const date=s=>s?new Intl.DateTimeFormat('fi-FI',{dateStyle:'short',timeStyle:'short'}).format(new Date(s*1000)):'—';
async function api(url,body){const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000),...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':info.csrfToken},body:JSON.stringify(body)})});const result=await response.json();if(!response.ok)throw Error(labels[result.error]||result.error||'Yhteys epäonnistui');return result}
function fillSchedule(schedule){$('dayStart').value=schedule.dayStart;$('nightStart').value=schedule.nightStart;$('dayInterval').value=schedule.dayIntervalMinutes;$('nightInterval').value=schedule.nightIntervalMinutes;$('nightEnabled').checked=schedule.nightEnabled;$('nightInterval').disabled=!schedule.nightEnabled}
async function refresh(initial=false){info=await api('/api/info');$('firmware').textContent=info.firmwareVersion;$('slot').textContent=info.bootSlot;$('nextCapture').textContent=date(info.nextCaptureAt);$('photoTime').textContent=date(info.lastCaptureAt);if(info.lastCapturedFile){$('photo').src='/api/photo?v='+encodeURIComponent(info.lastCapturedFile);$('photo').hidden=false}if(initial)fillSchedule(info.schedule);$('sessionState').textContent='Avoinna '+date(info.endsAt)}
$('nightEnabled').addEventListener('change',()=>{$('nightInterval').disabled=!$('nightEnabled').checked});
$('scheduleForm').addEventListener('submit',async event=>{event.preventDefault();if(!info)return;try{const schedule={dayStart:$('dayStart').value,nightStart:$('nightStart').value,dayIntervalMinutes:Number($('dayInterval').value),nightIntervalMinutes:Number($('nightInterval').value),nightEnabled:$('nightEnabled').checked};const result=await api('/api/schedule',schedule);info.schedule=result.schedule;fillSchedule(result.schedule);$('nextCapture').textContent=date(result.nextCaptureAt);$('scheduleMessage').textContent='Tallennettu · seuraava kuva '+date(result.nextCaptureAt)}catch(error){$('scheduleMessage').textContent=error.message}});
$('firmwareFile').addEventListener('change',async()=>{selected=null;$('upload').disabled=true;$('fileHash').textContent='';$('fileInfo').textContent='';const file=$('firmwareFile').files[0];if(!file||!info||closed)return;try{const buffer=await file.arrayBuffer(),view=new DataView(buffer);if(buffer.byteLength<288||buffer.byteLength>info.otaSlotSize||view.getUint8(0)!==233||view.getUint16(12,true)!==0||view.getUint32(32,true)!==0xabcd5432||!new TextDecoder().decode(buffer).includes(info.family))throw Error('Tiedosto ei ole tämän kameran OTA-ohjelma.');const digest=await crypto.subtle.digest('SHA-256',buffer);const hash=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');const elfHash=Array.from(new Uint8Array(buffer,176,32),x=>x.toString(16).padStart(2,'0')).join('');selected={file,hash,elfHash};$('fileInfo').textContent=(file.size/1024).toLocaleString('fi-FI',{maximumFractionDigits:0})+' kt';$('fileHash').textContent='SHA-256 '+hash;$('upload').disabled=false;$('updateMessage').textContent=''}catch(error){$('updateMessage').textContent=error.message}});
$('updateForm').addEventListener('submit',event=>{event.preventDefault();if(!selected||!info||upload||closed)return;const request=new XMLHttpRequest(),previousSlot=info.bootSlot,expectedElf=selected.elfHash;upload=request;$('upload').disabled=true;$('firmwareFile').disabled=true;$('scheduleFields').disabled=true;$('finish').disabled=true;$('cancelUpload').hidden=false;$('progress').hidden=false;$('progress').value=0;request.open('POST','/api/update');request.responseType='json';request.timeout=180000;request.setRequestHeader('Content-Type','application/octet-stream');request.setRequestHeader('X-CSRF-Token',info.csrfToken);request.setRequestHeader('X-Firmware-SHA256',selected.hash);request.upload.onprogress=event=>{if(event.lengthComputable)$('progress').value=event.loaded/event.total};const done=()=>{upload=null;$('firmwareFile').disabled=false;$('scheduleFields').disabled=false;$('finish').disabled=false;$('cancelUpload').hidden=true;$('upload').disabled=!selected;$('nightInterval').disabled=!$('nightEnabled').checked};request.onload=async()=>{if(request.status===200&&request.response?.updated&&request.response.sha256===selected.hash){$('cancelUpload').hidden=true;$('updateMessage').textContent='Ohjelma tarkistettu. Käynnistetään uudelleen…';let ready=false;for(let attempt=0;attempt<45;attempt++){await new Promise(resolve=>setTimeout(resolve,2000));try{await refresh(true);if(info.bootSlot!==previousSlot&&info.elfSha256===expectedElf){ready=true;break}}catch{}}$('updateMessage').textContent=ready?'Päivitys valmis':'Ohjelma lähetetty; käynnistystä ei vielä vahvistettu.'}else $('updateMessage').textContent=labels[request.response?.error]||request.response?.error||'Päivitys epäonnistui';done()};request.onerror=()=>{$('updateMessage').textContent='Yhteys katkesi';done()};request.ontimeout=()=>{$('updateMessage').textContent='Päivitys aikakatkaistiin';done()};request.onabort=()=>{$('updateMessage').textContent='Päivitys keskeytetty';done()};$('updateMessage').textContent='Lähetetään…';request.send(selected.file)});
$('cancelUpload').addEventListener('click',()=>upload?.abort());$('finish').addEventListener('click',async()=>{if(!info)return;try{const result=await api('/api/finish',{});closed=true;$('sessionState').textContent='Päättynyt';$('scheduleFields').disabled=true;$('firmwareFile').disabled=true;$('upload').disabled=true;$('finish').disabled=true;$('nextCapture').textContent=date(result.nextCaptureAt)}catch(error){$('scheduleMessage').textContent=error.message}});
refresh(true).catch(()=>{$('sessionState').textContent='Yhteys epäonnistui'});setInterval(()=>{if(!closed&&!upload)refresh().catch(()=>{$('sessionState').textContent='Yhteys ei ole käytettävissä'})},20000);
</script></main></body></html>
